<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1v1 Overlay Source</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Teko:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/one-v-one-overlay.css" />
  </head>
  <body>
    <div class="ovo-widget" id="ovo-widget" hidden>
      <header class="ovo-head">
        <p class="ovo-eyebrow">BLAKJAC21</p>
        <h1 class="ovo-title">1v1</h1>
      </header>
      <div class="ovo-board">
        <article class="ovo-side" id="ovo-left"></article>
        <div class="ovo-vs" aria-hidden="true"><span>VS</span></div>
        <article class="ovo-side" id="ovo-right"></article>
      </div>
    </div>
    <script src="/js/one-v-one-overlay.js"></script>
  </body>
</html>
