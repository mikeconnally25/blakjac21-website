<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream HUD Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Teko:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/stream-overlay.css" />
  </head>
  <body>
    <div class="so-hud">
      <div class="so-hud-frame" id="so-corners" aria-hidden="true">
        <span class="so-hud-frame-edge so-hud-frame-top"></span>
        <span class="so-hud-frame-edge so-hud-frame-left"></span>
        <span class="so-hud-frame-glow"></span>
      </div>

      <header class="so-hud-header">
        <div class="so-hud-brand-block">
          <img
            class="so-hud-logo"
            src="/images/logo.png"
            alt=""
            width="44"
            height="44"
          />
          <div class="so-hud-brand-copy">
            <p class="so-hud-kicker">Kick · Gambling</p>
            <p class="so-hud-brand" id="so-hud-brand">BLAKJAC21</p>
          </div>
        </div>

        <div class="so-hud-live" id="so-hud-live">
          <span class="so-hud-live-ring" aria-hidden="true">
            <span class="so-hud-live-dot"></span>
          </span>
          <div class="so-hud-live-copy">
            <span class="so-hud-live-label">On air</span>
            <span class="so-hud-live-title">LIVE</span>
          </div>
        </div>
      </header>

      <aside class="so-hud-cam" id="so-hud-cam" aria-hidden="true">
        <span class="so-hud-cam-label">Cam</span>
      </aside>

      <footer class="so-hud-bar">
        <div class="so-hud-bar-accent" aria-hidden="true"></div>
        <div class="so-hud-socials" id="so-hud-socials"></div>
        <div class="so-hud-ticker-wrap" id="so-hud-ticker-wrap">
          <span class="so-hud-ticker-label">Now</span>
          <div class="so-hud-ticker-track">
            <p class="so-hud-ticker" id="so-hud-ticker"></p>
          </div>
        </div>
      </footer>
    </div>
    <script src="/js/stream-overlay-shared.js"></script>
    <script src="/js/stream-overlay-hud.js"></script>
  </body>
</html>
