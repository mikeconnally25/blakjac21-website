<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream Alerts Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Teko:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/stream-overlay.css" />
  </head>
  <body>
    <div class="so-alerts">
      <div class="so-alert is-hidden" id="so-alert" role="status" aria-live="polite">
        <p class="so-alert-eyebrow" id="so-alert-eyebrow">Alert</p>
        <p class="so-alert-message" id="so-alert-message"></p>
      </div>
    </div>
    <script src="/js/stream-overlay-alerts.js"></script>
  </body>
</html>
